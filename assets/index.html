<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OAuth Login</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1rem;
    background: #f0f2f5;
  }
  .card {
    background: #fff;
    padding: 1.75rem;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,.08);
    max-width: 520px;
    width: 100%;
  }
  h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
  p  { color: #555; margin: 0 0 1.25rem; }
  button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border: 0;
    border-radius: 8px;
    background: #0d6efd;
    color: #fff;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { background: #0b5ed7; }
  button:disabled { background: #94b8ef; cursor: not-allowed; }
  button.secondary {
    background: #dc3545;
    margin-top: .75rem;
  }
  button.secondary:hover { background: #bb2d3b; }
  .status { margin: .75rem 0; font-weight: 600; }
  .status.ok    { color: #198754; }
  .status.error { color: #dc3545; }
  pre {
    background: #f6f8fa;
    padding: .85rem;
    border-radius: 8px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 12px;
    margin: .5rem 0 0;
  }
  h2 { font-size: 1rem; margin: 1rem 0 .25rem; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>OAuth Test</h1>
  <p id="intro">Sign in with your OAuth provider to test the flow.</p>

  <div id="loginView">
    <button id="loginBtn">Login with OAuth</button>
  </div>

  <div id="callbackView" class="hidden">
    <div id="status" class="status">Processing login...</div>
    <div id="output"></div>
    <button id="revokeBtn" class="secondary hidden">Revoke access token</button>
    <button id="startOverBtn" class="secondary hidden">Start over</button>
  </div>
</div>

<script>
/* ============================================================
   OAuth configuration
   ============================================================ */
const CLIENT_ID          = '92a9f588765598039a0710bfbf8c4ef2';
const REDIRECT_URI       = 'https://aayushpokhrel49.github.io/Aayushi3/assets/index.html';
const AUTHORIZE_ENDPOINT = 'http://betawebsite.gt.tc/oauth/authorize';
const TOKEN_ENDPOINT     = 'http://betawebsite.gt.tc/api/oauth/token';
const USERINFO_ENDPOINT  = 'http://betawebsite.gt.tc/api/oauth/userinfo';
const REVOKE_ENDPOINT    = 'http://betawebsite.gt.tc/api/oauth/revoke';
const SCOPES             = 'openid profile email';

/* ============================================================
   Element refs
   ============================================================ */
const loginView    = document.getElementById('loginView');
const callbackView = document.getElementById('callbackView');
const statusEl     = document.getElementById('status');
const outputEl     = document.getElementById('output');
const revokeBtn    = document.getElementById('revokeBtn');
const startOverBtn = document.getElementById('startOverBtn');

let accessToken = null;

/* ============================================================
   Helpers
   ============================================================ */
function base64UrlEncode(buffer) {
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function sha256(plain) {
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(plain));
}
function randomString(length = 64) {
  const bytes = new Uint8Array(length);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
}
function setStatus(msg, kind = '') {
  statusEl.textContent = msg;
  statusEl.className = 'status ' + kind;
}
function showCallbackView() {
  loginView.classList.add('hidden');
  callbackView.classList.remove('hidden');
  document.getElementById('intro').classList.add('hidden');
}

/* ============================================================
   Step 1 — Start the OAuth flow
   ============================================================ */
document.getElementById('loginBtn').addEventListener('click', async () => {
  try {
    const codeVerifier  = randomString(64);
    const codeChallenge = base64UrlEncode(await sha256(codeVerifier));
    const state         = randomString(32);

    sessionStorage.setItem('pkce_code_verifier', codeVerifier);
    sessionStorage.setItem('oauth_state', state);
    localStorage.setItem('pkce_code_verifier', codeVerifier);
    localStorage.setItem('oauth_state', state);

    const url = new URL(AUTHORIZE_ENDPOINT);
    url.searchParams.set('response_type', 'code');
    url.searchParams.set('client_id', CLIENT_ID);
    url.searchParams.set('redirect_uri', REDIRECT_URI);
    url.searchParams.set('scope', SCOPES);
    url.searchParams.set('state', state);
    url.searchParams.set('code_challenge', codeChallenge);
    url.searchParams.set('code_challenge_method', 'S256');

    window.location.href = url.toString();
  } catch (err) {
    alert('Failed to start login: ' + err.message);
  }
});

/* ============================================================
   Step 2 — Handle callback (if ?code= is in the URL)
   ============================================================ */
(async function handleCallbackIfPresent() {
  const params = new URLSearchParams(window.location.search);
  const code   = params.get('code');
  const state  = params.get('state');
  const error  = params.get('error');

  // If no code/error in URL → this is the login page. Do nothing.
  if (!code && !error) return;

  showCallbackView();

  if (error) {
    setStatus(`Authorization error: ${error}`, 'error');
    startOverBtn.classList.remove('hidden');
    return;
  }

  // Verify state
  const storedState = sessionStorage.getItem('oauth_state') || localStorage.getItem('oauth_state');
  if (!storedState || state !== storedState) {
    setStatus(
      `State mismatch.\nURL state: ${state}\nStored: ${storedState || '(none)'}`,
      'error'
    );
    startOverBtn.classList.remove('hidden');
    return;
  }

  // Get PKCE verifier
  const codeVerifier =
    sessionStorage.getItem('pkce_code_verifier') ||
    localStorage.getItem('pkce_code_verifier');

  if (!codeVerifier) {
    setStatus('PKCE code_verifier missing. Try logging in again.', 'error');
    startOverBtn.classList.remove('hidden');
    return;
  }

  // Clean up one-time values
  sessionStorage.removeItem('oauth_state');
  sessionStorage.removeItem('pkce_code_verifier');
  localStorage.removeItem('oauth_state');
  localStorage.removeItem('pkce_code_verifier');

  try {
    // Exchange code for token
    setStatus('Exchanging code for token...');
    const tokenRes = await fetch(TOKEN_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        grant_type:   'authorization_code',
        code,
        redirect_uri: REDIRECT_URI,
        client_id:    CLIENT_ID,
        code_verifier: codeVerifier
      })
    });

    const tokenText = await tokenRes.text();
    if (!tokenRes.ok) {
      throw new Error(`Token exchange failed (${tokenRes.status}): ${tokenText}`);
    }
    const tokenData = JSON.parse(tokenText);
    accessToken = tokenData.access_token;
    if (!accessToken) throw new Error('No access_token in response.');

    // Fetch user info
    setStatus('Fetching user info...');
    const userRes = await fetch(USERINFO_ENDPOINT, {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    const userText = await userRes.text();
    if (!userRes.ok) {
      throw new Error(`Userinfo failed (${userRes.status}): ${userText}`);
    }
    const userData = JSON.parse(userText);

    setStatus('Login successful ✓', 'ok');
    outputEl.innerHTML = `
      <h2>User Info</h2>
      <pre>${escapeHtml(JSON.stringify(userData, null, 2))}</pre>
      <h2>Token Response</h2>
      <pre>${escapeHtml(JSON.stringify(tokenData, null, 2))}</pre>
    `;
    revokeBtn.classList.remove('hidden');
    startOverBtn.classList.remove('hidden');

    // Clean URL so refresh doesn't retry
    window.history.replaceState({}, '', window.location.pathname);
  } catch (err) {
    setStatus(err.message, 'error');
    startOverBtn.classList.remove('hidden');
    console.error(err);
  }
})();

/* ============================================================
   Step 3 — Revoke
   ============================================================ */
revokeBtn.addEventListener('click', async () => {
  if (!accessToken) return;
  setStatus('Revoking token...');
  try {
    const res = await fetch(REVOKE_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        token: accessToken,
        token_type_hint: 'access_token',
        client_id: CLIENT_ID
      })
    });
    if (res.ok) {
      setStatus('Token revoked ✓', 'ok');
      revokeBtn.classList.add('hidden');
      outputEl.innerHTML = '';
    } else {
      setStatus(`Revoke failed: ${res.status}`, 'error');
    }
  } catch (err) {
    setStatus('Revoke error: ' + err.message, 'error');
  }
});

/* ============================================================
   Step 4 — Start over
   ============================================================ */
startOverBtn.addEventListener('click', () => {
  window.location.href = window.location.pathname;
});

/* ============================================================
   Tiny HTML escape
   ============================================================ */
function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}
</script>
</body>
</html>
