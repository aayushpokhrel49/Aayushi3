<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth Test Login</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f2f5; }
        .container { text-align: center; padding: 2rem; background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test OAuth Login</h1>
        <p>Click the button below to start the OAuth flow.</p>
        <button id="loginBtn">Login with OAuth</button>
    </div>

    <script>
        // --- Configuration ---
        const CLIENT_ID = '92a9f588765598039a0710bfbf8c4ef2';
        const REDIRECT_URI = 'https://aayushpokhrel49.github.io/Aayushi3/assets/callback.html';
        const AUTHORIZE_ENDPOINT = 'http://betawebsite.gt.tc/oauth/authorize';

        // --- Helper Functions for PKCE and State ---
        function base64UrlEncode(arrayBuffer) {
            return btoa(String.fromCharCode.apply(null, new Uint8Array(arrayBuffer)))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        async function sha256(plain) {
            const encoder = new TextEncoder();
            const data = encoder.encode(plain);
            return crypto.subtle.digest('SHA-256', data);
        }

        function generateRandomString(length = 64) {
            const array = new Uint8Array(length);
            crypto.getRandomValues(array);
            return Array.from(array, byte => ('0' + byte.toString(16)).slice(-2)).join('');
        }

        // --- Main OAuth Flow Initiation ---
        document.getElementById('loginBtn').addEventListener('click', async () => {
            // 1. Generate PKCE code_verifier and code_challenge
            const codeVerifier = generateRandomString(64);
            const hashed = await sha256(codeVerifier);
            const codeChallenge = base64UrlEncode(hashed);

            // 2. Generate a random 'state' for CSRF protection
            const state = generateRandomString(32);

            // 3. Store the code_verifier and state in sessionStorage for later use in the callback page
            sessionStorage.setItem('pkce_code_verifier', codeVerifier);
            sessionStorage.setItem('oauth_state', state);

            // 4. Build the authorization URL
            const authUrl = new URL(AUTHORIZE_ENDPOINT);
            authUrl.searchParams.append('response_type', 'code');
            authUrl.searchParams.append('client_id', CLIENT_ID);
            authUrl.searchParams.append('redirect_uri', REDIRECT_URI);
            authUrl.searchParams.append('scope', 'openid profile email'); // Adjust scopes as needed
            authUrl.searchParams.append('state', state);
            authUrl.searchParams.append('code_challenge', codeChallenge);
            authUrl.searchParams.append('code_challenge_method', 'S256');

            // 5. Redirect the user to the authorization server
            window.location.href = authUrl.toString();
        });
    </script>
</body>
</html>
